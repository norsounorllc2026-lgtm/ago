<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hot 16 Analyzer</title>
<style>
:root{
  --bg:#111214;--panel:#1a1b1f;--panel2:#22242a;--line:#2e3138;--text:#ececec;--muted:#9a9ca3;--gold:#d4a017;--gold2:#f4c430;
  --good:#53c27a;--bad:#e85757;--info:#4fa3f7;--radius:10px;--mono:"JetBrains Mono",Consolas,"SFMono-Regular",Menlo,monospace;
}
:root[data-theme="light"]{--bg:#f6f5f2;--panel:#ffffff;--panel2:#f0eee9;--line:#dedad2;--text:#1d1d1f;--muted:#6b6b70;--gold:#a87d00;--gold2:#c99400}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--info)}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0 auto 0 0;font-size:20px;letter-spacing:.02em}
header h1 span{color:var(--gold)}
.hstats{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.hstats b{color:var(--text);font-size:18px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.badge.admin{border-color:var(--gold);color:var(--gold)}
nav{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{background:none;border:0;color:var(--muted);padding:12px 14px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--gold)}
main{max-width:1250px;margin:0 auto;padding:20px 16px 60px}
main,section.tab,details,.card,.grid>div{min-width:0}
.hscroll>.tbl,.scroll>.tbl{min-width:640px}
@media (max-width:600px){details>.body{padding:0 10px 12px}main{padding:14px 10px 40px}}
section.tab{display:none}section.tab.on{display:block}
h2{font-size:20px;margin:6px 0 10px}h3{font-size:17px;margin:22px 0 8px}h4{font-size:15px;margin:14px 0 6px}
.cap{color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:3fr 2fr}.g4{grid-template-columns:1.1fr 1fr 1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:820px){.g2,.g4,.g3{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
textarea,input[type=text],input[type=password],select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit}
textarea{font-family:var(--mono);font-size:14px;line-height:1.6;resize:vertical}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#111;font-weight:600}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.metric .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.metric .v{font-size:28px;font-weight:700}
.grade{font-size:60px;font-weight:800;line-height:1;color:var(--gold)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
.hscroll{overflow-x:auto;max-width:100%}
.scroll{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}
.bar-line{font-family:var(--mono);font-size:14px;line-height:1.95;margin:0}
.bar-num{color:var(--muted);display:inline-block;width:2.2em}
.scheme{color:var(--gold);font-weight:700;display:inline-block;width:1.4em}
.rw{border-radius:4px;padding:1px 3px}
details{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin:10px 0}
details>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--gold)}details[open]>summary::before{content:"▾ "}
details>.body{padding:0 16px 16px}
.dimbar{display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.dimbar .track{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.dimbar .fill{height:100%;background:var(--gold)}
.note{border-left:3px solid var(--info);padding:6px 10px;background:var(--panel2);border-radius:6px;font-size:13px;margin:8px 0}
.warn{border-left-color:var(--bad)}
.ok{border-left-color:var(--good)}
.subtabs{display:flex;gap:6px;margin:10px 0}
.subtabs button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
.subtabs button.on{color:var(--text);border-color:var(--gold)}
pre.lyrics{white-space:pre-wrap;font-family:var(--mono);font-size:14px;background:var(--panel2);border-radius:8px;padding:12px;max-height:420px;overflow:auto}
.ed td{padding:4px}.ed input{padding:6px 8px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:20;flex-direction:column;gap:10px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;right:16px;bottom:16px;background:var(--panel);border:1px solid var(--gold);padding:10px 14px;border-radius:8px;z-index:30;max-width:360px}
</style>
</head>
<body>
<div id="loading"><div class="spin"></div><div class="cap" id="loadmsg">Loading the analyzer…</div></div>
<header>
  <button class="btn" id="backAgo" style="padding:6px 12px;font-size:14px">← American Griot One</button>
  <h1>🎤 Hot 16 <span>Analyzer</span></h1>
  <div class="hstats">
    <div>Master Standard <b id="ms">—</b></div>
    <div id="mscov"></div>
    <span class="badge" id="mode">Viewing</span>
    <span class="cap">v6</span>
  </div>
</header>
<nav id="tabs"></nav>
<main>
  <section class="tab" id="t-analyze"></section>
  <section class="tab" id="t-standards"></section>
  <section class="tab" id="t-rank"></section>
  <section class="tab" id="t-tech"></section>
  <section class="tab" id="t-guide"></section>
</main>

<script>/* Hot 16 Analyzer scoring engine - JavaScript port of engine/*.py (engine version 4).
   Runs in the browser (and in Node for testing). Call H16.init(...) once, then H16.scoreVerse(text). */
(function (root) {
"use strict";
const H16 = {};
let CMU = null, LEX = null, PH = null, TECHS = null, CAT = null, RULES = null, RANK = null, ZIPF = null;
let VOWELS, STOP, FILLER, CAT_IDS;

/* ------------------------------------------------------------ helpers */
const pyRound = (x, n = 0) => {      // Python round(): correctly rounded on the exact binary value, ties to even
  if (!isFinite(x) || x === 0) return x;
  const exact = Math.abs(x).toFixed(Math.min(100, n + 80));
  const dot = exact.indexOf("."), rest = exact.slice(dot + 1 + n);
  if (/^50*$/.test(rest)) {                            // exact tie
    const f = Math.pow(10, n), lo = Math.floor(Math.abs(x) * f);
    const r = (lo % 2 === 0 ? lo : lo + 1) / f;
    return x < 0 ? -r : r;
  }
  return Number(x.toFixed(n));
};
function pySum(arr) {                // Python 3.12+ sum() of floats (Neumaier compensated)
  let sum = 0, c = 0;
  for (const x of arr) { const t = sum + x; if (Math.abs(sum) >= Math.abs(x)) c += (sum - t) + x; else c += (x - t) + sum; sum = t; }
  return sum + c;
}
const fmtG = x => (x === null || x === undefined) ? "" : String(Number(Number(x).toPrecision(6)));
const isDigits = s => /^[0-9]+$/.test(s);
const noDigits = s => s.replace(/\d/g, "");
const rstripS = s => s.replace(/s+$/, "");
function stripChars(s, chars) {

}
function mostCommon(arr) {           // Python Counter(arr).most_common(1)[0] (first max wins)
  const m = new Map();
  for (const x of arr) m.set(x, (m.get(x) || 0) + 1);
  let best = null, bc = -1;
  for (const [k, c] of m) if (c > bc) { best = k; bc = c; }
  return [best, bc];
}
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const pstdev = a => { const mu = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - mu) * (x - mu), 0) / a.length); };

/* ------------------------------------------------------------ init */
H16.init = function (o) {

  RANK = o.rankings; ZIPF = new Map(); for (const [v, ws] of Object.entries(o.zipf)) for (const w of ws.split(" ")) ZIPF.set(w, parseFloat(v));
  VOWELS = new Set(PH.VOWELS); STOP = new Set(LEX.STOPWORDS); FILLER = new Set(LEX.FILLER);
  for (const k of ["ENTENDRE_ANCHORS", "SENSORY", "EMOTION", "SOCIAL", "BRAG", "NARRATIVE_MARKERS", "HYPERBOLE",

  H16.DIMS = TECHS.dimensions;
  H16.WEIGHTS = TECHS.overall_weights || { rhyme: 0.27, wordplay: 0.27, storytelling: 0.18, flow: 0.12, content: 0.16 };
  H16.CATEGORIES = CAT.categories;

/* ------------------------------------------------------------ phonetics */
function pronsFor(w) {

    let matched = false, brk = false;

      if (w.startsWith(spell, i)) {

        if (["er", "ir", "ur", "ar", "or"].includes(spell) && ph !== "ER") phones.push("R");

    if (matched) continue;
    for (const [spell, ph] of PH.CONS_MAP) {
      if (w.startsWith(spell, i)) { phones.push(...ph.split(" ")); i += spell.length; matched = true; break; }
    }

    for (let k = phones.length - 1; k >= 0; k--) {

    }
  }

  for (let k = 0; k < phones.length; k++) {
    const p = phones[k];

}
const _cache = new Map();
function lookup(word) {
  if (!word) return ["", true];
  if (_cache.has(word)) return _cache.get(word);

  if (PH.NUMBER_WORDS[word] !== undefined) {
    res = [PH.NUMBER_WORDS[word].split(" ").map(p => lookup(p)[0]).join(" "), true];
  } else if (isDigits(word)) {
    res = [word.split("").map(d => lookup(d)[0]).join(" "), true];
  } else {
    for (const v of variants(word)) { const ph = pronsFor(v); if (ph.length) { res = [ph[0], true]; break; } }
    if (!res) {
      if (word.includes("-")) res = [word.split("-").filter(Boolean).map(p => lookup(p)[0]).join(" "), false];
      else res = [guessPhones(word), false];
    }
  }
  _cache.set(word, res);
  return res;
}
function syllabify(phones, wordIdx) {
  const toks = phones.split(/\s+/).filter(Boolean), sylls = [];
  toks.forEach((t, i) => {
    const base = noDigits(t);
    if (VOWELS.has(base)) {
      const stress = /\d$/.test(t) ? parseInt(t[t.length - 1], 10) : 0;
      const coda = [];
      for (const t2 of toks.slice(i + 1)) { if (VOWELS.has(noDigits(t2))) break; coda.push(t2); }
      sylls.push({ vowel: base, stress, coda, word_idx: wordIdx });
    }
  });
  for (const s of sylls.slice(0, -1)) s.coda = s.coda.slice(0, 1);
  return sylls;
}
function rhymingPart(phones) {
  const l = phones.split(/\s+/).filter(Boolean);
  for (let i = l.length - 1; i > 0; i--) if ("12".includes(l[i][l[i].length - 1])) return l.slice(i).join(" ");
  return phones;
}
function rhymeTail(phones) { return phones ? noDigits(rhymingPart(phones)) : ""; }
let _rev = null;
function reverseIndex() {
  if (_rev) return _rev;
  _rev = new Map();
  for (const k in CMU) {
    const w = k.replace(/\(\d+\)$/, "");
    if (!/^[a-z]+$/i.test(w)) continue;
    const key = noDigits(CMU[k]);
    let s = _rev.get(key); if (!s) { s = new Set(); _rev.set(key, s); }
    s.add(w);
  }
  return _rev;
}
function homophonesOf(word) {
  const [ph, found] = lookup(word);
  if (!found || !ph) return [];
  const s = reverseIndex().get(noDigits(ph));
  if (!s) return [];

}
function zipfOf(w) {

  if (ZIPF.has(w)) return ZIPF.get(w);

  if (parts.length > 1) {

    for (const p of parts) { const z = ZIPF.get(p); if (z === undefined) return 0; inv += 1 / Math.pow(10, z - 9); }

const zipfAtLeast = (w, th) => zipfOf(w) >= th;
function codaSim(a, b) {
  const eq = (x, y) => x.length === y.length && x.every((v, i) => v === y[i]);

/* ------------------------------------------------------------ analyzer */
const LOOKBACK = 20, WEAK = new Set(["AH", "IH"]), REDUCED = new Set(["AH", "IH", "EH", "UH"]);

    const toks = bar.match(/[A-Za-z0-9][A-Za-z0-9'’\-]*'?|'[A-Za-z]+/g) || [];

      const norm = normalize(tok);
      if (!norm) return;
      const [ph, found] = lookup(norm);

    });

const veq = (a, b) => a.vowel === b.vowel || (a.stress === 0 && b.stress === 0 && REDUCED.has(a.vowel) && REDUCED.has(b.vowel));
const elidable = s => s.stress === 0 && WEAK.has(s.vowel);
function align(S, p, q) {

const matchLen = (S, p, q) => align(S, p, q).length;
const spans = pairs => [[pairs[pairs.length - 1][1], pairs[0][1]], [pairs[pairs.length - 1][0], pairs[0][0]]];
function effective(S, p, q, k) {
  let eff = 0, both = false;
  for (const [ip, iq] of align(S, p, q).slice(0, k)) {
    const a = S[ip], b = S[iq];

    if (WEAK.has(a.vowel) && a.stress === 0 && b.stress === 0) continue;
    eff++;

}
function accept(eff, cs, weakEnd) {
  if (eff === 0) return false;
  if (eff === 1) return cs >= 0.5 && !weakEnd;
  if (weakEnd) return eff >= 3;
  return eff >= 3 || cs >= 0.35;

const skipWord = w => FILLER.has(w.norm);
const vkey = (S, p, n) => { const out = []; for (let i = 0; i < n; i++) out.push(S[p - i].vowel); return out.reverse(); };

function findMatches(words, S, endPos, barEnd) {
  const matches = [];

    if (!endPos.has(w.idx) || skipWord(w)) continue;
    const p = endPos.get(w.idx);

    for (const u of words.slice(Math.max(0, w.idx - LOOKBACK), w.idx)) {

      if (barEnd.has(u.idx) && barEnd.has(w.idx) && w.bar - u.bar > 0 && w.bar - u.bar <= 4) continue;

      const cs = codaSim(S[p].coda, S[q].coda);

      if (!accept(eff, cs, weakEnd)) continue;

      const cand = { a_word: u.idx, b_word: w.idx, a_span: qs, b_span: ps, length: k, eff, coda: cs,
                     key: vkey(S, p, Math.min(k, 3)) };

}
function altTailsRhyme(a, b) {

const CMU_URL = "https://cdn.jsdelivr.net/npm/cmu-pronouncing-dictionary@3.0.0/index.js";
const PALETTE = ["#f4c43066","#4fa3f766","#e8575766","#53c27a66","#b57bf066","#f08a3c66","#3cc8c866","#e86fb066","#9bc53d66","#7a8cf066","#c9a26b66","#5ad1a066"];

let IS_ADMIN = false, MODE = "standalone";  // "wix" when running inside the Wix page

const g = H16.fmtG;

function toast(msg, ms = 3500) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

async function unpack(b64) {
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}
async function loadCMU() {
  try { const m = await import(CMU_URL); return m.dictionary; }
  catch (e) { console.warn("CMU dictionary failed to load", e); return null; }
}
const WIX = { pending: {}, n: 0 };
function toWix(msg) { window.parent.postMessage(Object.assign({ source: "hot16" }, msg), "*"); }
function wixCall(op, args) {
  return new Promise((resolve, reject) => {
    const id = ++WIX.n; WIX.pending[id] = { resolve, reject };
    toWix({ type: "hot16:call", id, op, args });
    setTimeout(() => { if (WIX.pending[id]) { delete WIX.pending[id]; reject(new Error("The Wix page did not answer. Is the page code installed?")); } }, 20000);
  });
}
function waitForWix(ms) {
  return new Promise(resolve => {
    if (window.parent === window) return resolve(null);
    const t = setTimeout(() => resolve(null), ms);
    WIX.onInit = data => { clearTimeout(t); resolve(data); };
    toWix({ type: "hot16:ready" });
  });
}
window.addEventListener("message", ev => {
  const m = ev.data;
  if (!m || typeof m !== "object") return;
  if (m.type === "hot16:init" && WIX.onInit) { WIX.onInit(m); WIX.onInit = null; }
  if (m.type === "hot16:reply" && WIX.pending[m.id]) {
    const p = WIX.pending[m.id]; delete WIX.pending[m.id];
    m.ok ? p.resolve(m.result) : p.reject(new Error(m.error || "Save failed"));
  }
});

function rosterFromDefaults() {
  const r = {};
  for (const c of D.categories.categories) r[c.id] = c.candidates.map(x => ({ artist: x.artist, song: x.song || "", bars: x.bars || "", lyrics: "" }));
  for (const e of Object.values(D.default_lyrics)) {
    const row = (r[e.category] || []).find(x => x.artist === e.artist);
    if (row) { row.lyrics = e.lyrics; if (e.song) row.song = e.song; }
  }
  return r;
}
function rosterFromCMS(items) {
  const r = {}; for (const c of D.categories.categories) r[c.id] = [];
  for (const it of [...items].sort((a, b) => (a.order ?? 0) - (b.order ?? 0)))
    if (r[it.category]) r[it.category].push({ artist: it.artist || "", song: it.song || "", bars: it.bars || "", lyrics: it.lyrics || "" });
  return r;
}
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
async function rebuildBench(msgFn) {
  // apply the roster to the category definitions, then score every locked 16 (cached per lyrics)
  for (const c of H16.CATEGORIES) c.candidates = (ROSTER[c.id] || []).map(x => ({ artist: x.artist, song: x.song, bars: x.bars }));
  const cache = store("hot16_bench_cache") || {};
  const fresh = {}; const entries = {};
  const all = []; for (const c of H16.CATEGORIES) for (const x of ROSTER[c.id] || []) if (x.lyrics && x.lyrics.trim()) all.push([c.id, x]);
  let i = 0;
  for (const [cid, x] of all) {
    const key = `${D.engine_version}:${S.cmuMissing ? 0 : 1}:${cid}:${hash(x.lyrics)}`;
    let e = cache[key];
    if (!e) {
      if (msgFn) { msgFn(`Scoring the Hot 16s… ${++i}/${all.length}`); await new Promise(r => setTimeout(r, 0)); }
      e = H16.makeEntry(cid, x.artist, x.song, x.lyrics); delete e.lyrics;
    }
    fresh[key] = e;
    entries[H16.entryId(cid, x.artist)] = Object.assign({}, e, { artist: x.artist, song: x.song, lyrics: x.lyrics });
  }
  store("hot16_bench_cache", fresh);
  BENCH = { entries };
}

async function boot() {
  const msg = t => { $("#loadmsg").textContent = t; };
  try {
    msg("Loading data…");
    D = await unpack(DATA_GZ_B64);
    msg("Loading the pronouncing dictionary…");
    const [cmu, wix] = await Promise.all([loadCMU(), waitForWix(2500)]);
    H16.init({ cmu: cmu || {}, lexicons: D.lexicons, techniques: D.techniques, categories: D.categories,
               context_rules: D.context_rules, rankings: D.rankings, zipf: D.zipf });
    S.cmuMissing = !cmu;
    if (wix) {
      MODE = "wix"; IS_ADMIN = !!wix.admin;
      ROSTER = wix.items && wix.items.length ? rosterFromCMS(wix.items) : rosterFromDefaults();
      S.cmsEmpty = !(wix.items && wix.items.length);
    } else {
      MODE = "standalone";
      IS_ADMIN = /(^|[#&?])admin\b/.test(location.hash + location.search);
      ROSTER = (IS_ADMIN && store("hot16_local_roster")) || rosterFromDefaults();
    }
    await rebuildBench(msg);
    buildTabs(); renderAll();
    $("#loading").remove();
  } catch (e) {
    console.error(e);
    msg("Could not start: " + e.message + ". This page needs a current browser (Chrome, Edge, Safari 16.4+ or Firefox 113+).");
  }
}

const CAT = id => H16.CATEGORIES.find(c => c.id === id);
const TECHNAME = id => (H16.TECH[id] || {}).name || id;
function table(cols, rows, opts = {}) {
  const head = "<tr>" + cols.map(c => `<th>${esc(c)}</th>`).join("") + "</tr>";
  const body = rows.map(r => "<tr>" + r.map(v => `<td>${v === null || v === undefined ? "" : (opts.raw ? v : esc(v))}</td>`).join("") + "</tr>").join("");
  const t = `<table class="tbl">${head}${body}</table>`;
  return opts.scroll ? `<div class="scroll" style="max-height:${opts.scroll}px">${t}</div>` : `<div class="hscroll">${t}</div>`;
}

/* ---------------------------------------------------------------- verse rendering */
function highlighted(an) {
  const keys = new Map();
  for (const k of an.word_colors.values()) if (!keys.has(k)) keys.set(k, PALETTE[keys.size % PALETTE.length]);
  const byBar = new Map(); for (const w of an.words) { if (!byBar.has(w.bar)) byBar.set(w.bar, []); byBar.get(w.bar).push(w); }
  return an.bars.map((bar, b) => {
    let out = "", cur = 0;
    for (const w of byBar.get(b) || []) {
      const st = bar.indexOf(w.text, cur); if (st < 0) continue;
      out += esc(bar.slice(cur, st));
      let tok = esc(w.text);
      if (an.word_colors.has(w.idx)) tok = `<span class="rw" style="background:${keys.get(an.word_colors.get(w.idx))}">${tok}</span>`;
      out += tok; cur = st + w.text.length;
    }
    out += esc(bar.slice(cur));
    return `<p class="bar-line"><span class="bar-num">${b + 1}</span><span class="scheme">${esc(an.scheme[b] || "")}</span>${out} <span class="cap">· ${an.bar_syllables[b]} syl</span></p>`;
  }).join("");
}
function perBarRows(an, offset) {
  const hits = an.bars.map(() => []);
  const pens = new Set(D.techniques.techniques.filter(t => t.dim === "penalty").map(t => t.id));
  const flags = an.bars.map(() => []);
  for (const [tid, items] of Object.entries(an.instances)) {
    const t = H16.TECH[tid]; if (!t || ["slang_coinage", "specificity", "reversal"].includes(tid)) continue;
    for (const it of items) if (it.bar >= 0 && it.bar < an.bars.length) {
      const name = t.name + (it.confirmed ? "" : " (?)");
      const list = pens.has(tid) ? flags[it.bar] : hits[it.bar];
      if (!list.includes(name)) list.push(name);
    }
  }
  return an.bars.map((_, b) => [b + 1 + offset, an.scheme[b] || "", an.bar_syllables[b], hits[b].length, hits[b].join(", ") || "—", flags[b].join(", ")]);
}
function verdict(an, card, catId) {
  const cat = CAT(catId);
  const strong = Object.values(card.techniques).filter(t => t.dim !== "penalty" && t.cap && t.points > 0).sort((a, b) => b.points / b.cap - a.points / a.cap).slice(0, 4);
  const dimsSorted = Object.keys(H16.DIMS).sort((a, b) => card.dims[a] - card.dims[b]);
  const L = [`As <b>${esc(cat.name)}</b>: <b>${card.category_scores[catId]}</b> (overall ${card.overall}, ${card.grade} - ${card.grade_label}). ${an.bars.length} bars, rhyme density ${an.metrics.rhyme_density}, scheme <code>${esc(an.scheme)}</code>.`];
  L.push("<b>Strongest:</b> " + strong.map(t => `${esc(t.name)} (${g(t.points)}/${g(t.cap)} pts)`).join("; ") + ".");
  L.push("<b>Held back by:</b> " + dimsSorted.slice(0, 2).map(d => `${H16.DIMS[d].label} at ${card.dims[d]}`).join("; ") + (card.penalty ? `; penalties ${card.penalty}` : "") + ".");
  const unconf = Object.values(card.techniques).filter(t => t.count > t.confirmed && t.detect === "auto+ai").map(t => t.name);
  if (unconf.length) L.push("<b>Unconfirmed (partial credit):</b> " + esc(unconf.slice(0, 6).join(", ")) + ".");
  const orph = (an.instances.orphan_bar || []).map(i => i.bar + 1);
  if (orph.length) L.push(`<b>Bars with no end-rhyme partner (section numbering):</b> ${orph.join(", ")}.`);
  return L.map(l => `<p>${l}</p>`).join("");
}
function scoreMath(an, card, catId) {
  const w = CAT(catId).weights, rows = [];
  for (const d in H16.DIMS) rows.push([H16.DIMS[d].label, card.dims[d], pct(w[d]), H16.pyRound(card.dims[d] * w[d], 2)]);
  const clues = card.theme_hits[catId], bonus = Math.min(5, clues / Math.max(1, an.bars.length) * 16 * 0.3);
  rows.push(["Penalties", "", "", card.penalty]);
  rows.push([`Context bonus (${g(clues)} style clues)`, "", "", H16.pyRound(bonus, 2)]);
  rows.push(["Category score", "", "", card.category_scores[catId]]);
  return table(["Part", "Score", "Weight", "Points"], rows);
}
function dimBars(dims) {
  return Object.keys(H16.DIMS).map(d => `<div class="dimbar"><div>${esc(H16.DIMS[d].label)}</div><div class="track"><div class="fill" style="width:${dims[d]}%"></div></div><div>${dims[d]}</div></div>`).join("");
}
function renderSection(sec, catId) {
  const an = sec.analysis, card = sec.card;
  const tech = Object.values(card.techniques).filter(t => t.count || t.points)
    .sort((a, b) => a.dim < b.dim ? -1 : a.dim > b.dim ? 1 : b.points - a.points)
    .map(t => [t.name, t.dim, t.count, t.confirmed, t.points, t.cap, t.detect, t.examples.slice(0, 4).join(" | ")]);
  const homo = an.homophone_candidates.slice(0, 25).map(([b, t, hs]) => `bar ${b + 1}: <b>${esc(t)}</b> ↔ ${esc(hs.join(", "))}`).join(" · ");
  return `<h3>Verdict</h3>${verdict(an, card, catId)}
  <div class="grid g2"><div><h3>Rhyme map</h3><p class="cap">Same color = same rhyme sound. Gold letter = end-rhyme scheme (x = no end rhyme). Bar numbers are within this section.</p><div class="card">${highlighted(an)}</div></div>
  <div><h3>How the score was built</h3>${scoreMath(an, card, catId)}<h3>Dimensions</h3>${dimBars(card.dims)}</div></div>
  <h3>Bar-by-bar breakdown</h3><p class="cap">(?) = flagged by the rules, not confirmed. Bar numbers here are verse bar numbers.</p>
  ${table(["Bar", "Scheme", "Syllables", "Techniques", "What's happening", "Problems"], perBarRows(an, sec.start), { scroll: 520 })}
  <h3>Every technique found</h3>${table(["Technique", "Dimension", "Found", "Confirmed", "Points", "Cap", "Detect", "Examples"], tech, { scroll: 460 })}
  <h3>Flow numbers & homophone candidates</h3>
  <p>Syllables per bar: ${esc((an.metrics.syllables_per_bar || []).join(", "))} · mean ${an.metrics.syllables_per_bar_mean} · spread ${an.metrics.syllables_per_bar_sd}</p>
  ${homo ? `<p>${homo}</p>` : ""}${card.notes.map(n => `<p class="cap">ℹ️ ${esc(n)}</p>`).join("")}`;
}
function renderStyle(sr) {
  const top = sr.fits[0];
  return `<h4>Style read: ${esc(top.name)}${sr.mixed ? ` (mixed with ${esc(sr.fits[1].name)})` : ""}</h4>
  <p class="cap">Method: ${esc(sr.method)} · confidence ${sr.confidence} · ${g(sr.clues_per_16)} style clues per 16 bars</p>
  <div class="grid g3">${sr.fits.slice(0, 3).map(f => `<div class="card"><b>${esc(f.name)}</b> — ${g(f.score)}
    <div class="cap">context ${g(f.context)}${f.style !== null ? ` · style match ${g(f.style)}%` : ""}</div>
    ${(f.evidence.length ? f.evidence : ["no phrase-level clues"]).map(e => `<div style="font-size:13px">• ${esc(e)}</div>`).join("")}</div>`).join("")}</div>`;
}
function renderVerse(el, vr, artist, catId, key, opts = {}) {
  const sr = opts.sr;
  let h = `<div class="grid g4" style="align-items:end">
    <div><div class="cap" style="text-transform:uppercase;letter-spacing:.08em">Whole verse</div><div class="grade">${vr.grade}</div><div>${vr.overall} / 100 · ${esc(vr.grade_label)}</div></div>
    <div class="metric"><div class="k">As ${esc(CAT(catId).name)}</div><div class="v">${vr.category_scores[catId]}</div></div>
    <div class="metric"><div class="k">Bars</div><div class="v">${vr.bars.length}</div></div>
    <div class="metric"><div class="k">Sections graded</div><div class="v">${vr.sections.length}</div></div></div>`;
  if (artist) { const r = H16.rankOf(artist); h += `<p class="cap">${esc(artist)}: ${r ? "#" + r + " in the Top 100" : "not in the Top 100"}</p>`; }
  for (const n of vr.notes) h += `<p class="cap">ℹ️ ${esc(n)}</p>`;
  if (sr) h += renderStyle(sr);
  const fit = Object.entries(vr.category_scores).sort((a, b) => b[1] - a[1]).map(([k, v]) => [CAT(k).name, v, H16.pyRound(vr.context.raw[k] || 0, 2)]);
  h += `<h3>Category fit</h3>${table(["Category", "Score", "Style clues"], fit)}`;
  if (vr.sections.length > 1) {
    h += `<h3>Sections</h3>${table(["Section", "Bars", "Overall", "Grade", "As " + CAT(catId).name], vr.sections.map(s => [s.label, s.end - s.start, s.card.overall, s.card.grade, s.card.category_scores[catId]]))}
      <label style="margin-top:10px">Show the full breakdown for</label><select class="secpick" style="max-width:260px">${vr.sections.map((s, i) => `<option value="${i}">${s.label}</option>`).join("")}</select>`;
  }
  h += `<div class="secbody"></div>`;
  if (opts.compare) h += `<div class="cmp"></div>`;
  el.innerHTML = h;
  const body = $(".secbody", el);
  const show = i => { const s = vr.sections[i]; body.innerHTML = `<hr style="border-color:var(--line);margin:22px 0"><h3>Breakdown — ${s.label}</h3>` + renderSection(s, catId); };
  show(0);
  const pick = $(".secpick", el); if (pick) pick.onchange = () => show(+pick.value);
  if (opts.compare) $(".cmp", el).innerHTML = renderCompare(vr, artist, catId);
}
function renderCompare(vr, artist, catId) {
  const c = H16.compare(vr, artist, BENCH);
  if (!c.has_standards) return `<h3>Against the standards</h3><div class="note">No Hot 16s are locked in yet, so there is nothing to compare against.</div>`;
  let h = `<h3>Against the standards</h3><div class="grid g3">
    <div class="card metric"><div class="k">Master Standard Index</div><div class="v">${c.master_index}</div><div class="cap">100 = equal to the average Hot 16</div></div>
    <div class="card metric"><div class="k">Closest technique profile</div><div class="v" style="font-size:20px">${esc(c.closest)}</div></div>
    <div class="card metric"><div class="k">Standard built from</div><div class="v" style="font-size:16px">${esc(c.coverage)}</div></div></div>`;
  for (const pc of c.per_category) {
    const weak = pc.weaknesses.filter(x => x[1] < 0).map(([t, d, m, s]) => `<div>${esc(TECHNAME(t))}: you ${pct(m)} vs standard ${pct(s)} of cap</div>`).join("") || "<div class='cap'>none</div>";
    const strong = pc.strengths.filter(x => x[1] > 0).map(([t, d, m, s]) => `<div>${esc(TECHNAME(t))}: you ${pct(m)} vs standard ${pct(s)}</div>`).join("") || "<div class='cap'>none</div>";
    h += `<details ${pc.category === catId ? "open" : ""}><summary>${esc(pc.name)} — index ${pc.standard_index} · style match ${pc.style_match}% · would place #${pc.would_place}</summary><div class="body">
      <p>Your score ${pc.your_score} vs standard ${pc.standard_score}. Benchmarks: ${esc(pc.benchmarks.map(([p, a, s]) => `#${p} ${a} (${s})`).join(", "))}</p>
      <div class="grid" style="grid-template-columns:1fr 1fr"><div><b>Biggest gaps</b>${weak}</div><div><b>Where you beat it</b>${strong}</div></div></div></details>`;
  }
  return h;
}

        <td><input type="text" data-f="artist" value="${esc(r.artist)}"></td><td><input type="text" data-f="song" value="${esc(r.song)}"></td>
        <td><input type="text" data-f="bars" value="${esc(r.bars)}"></td><td><button class="btn danger del">✕</button></td></tr>`).join("")}</table></div>
      <div class="row" style="margin-top:10px"><button class="btn add">+ Add artist</button><button class="btn primary save">Save artists</button><span class="cap">${rows.length} artists</span></div>`;
    body.querySelectorAll("input[data-f]").forEach(inp => inp.oninput = () => { rows[+inp.closest("tr").dataset.i][inp.dataset.f] = inp.value; });
    body.querySelectorAll(".up,.dn,.del").forEach(b => b.onclick = () => {
      const i = +b.closest("tr").dataset.i;
      if (b.classList.contains("del")) rows.splice(i, 1);
      else { const j = b.classList.contains("up") ? i - 1 : i + 1; [rows[i], rows[j]] = [rows[j], rows[i]]; }
      draw();
    });
    $(".add", body).onclick = () => { rows.push({ artist: "", song: "", bars: "", lyrics: "" }); draw(); };
    $(".save", body).onclick = () => {
      const clean = [], seen = new Set();
      for (const r of rows) { const a = r.artist.trim(); if (!a || seen.has(a.toLowerCase())) continue; seen.add(a.toLowerCase()); clean.push({ artist: a, song: r.song.trim(), bars: r.bars.trim() }); }
      if (clean.length < 3) { toast("A category needs at least 3 artists (its standard is the top 3)."); return; }
      adminSave("saveRoster", { category: cat.id, rows: clean }, "Artists saved.");
    };
  };
  draw();
}
const flatRoster = r => Object.entries(r).flatMap(([cid, list]) => list.map((x, i) => ({ category: cid, artist: x.artist, song: x.song, bars: x.bars, order: i + 1, lyrics: x.lyrics || "" })));
function applyLocal(op, a) {
  if (op === "lockIn") { const x = ROSTER[a.category].find(r => r.artist === a.artist); if (x) x.lyrics = a.lyrics; }
  if (op === "saveRoster") {
    const old = ROSTER[a.category];
    ROSTER[a.category] = a.rows.map(r => { const o = old.find(x => x.artist.toLowerCase() === r.artist.toLowerCase()); return { ...r, lyrics: o ? o.lyrics : "" }; });
  }
  if (op === "seed") ROSTER = rosterFromDefaults();
}
async function adminSave(op, args, okMsg) {
  if (!IS_ADMIN) return;
  try {
    if (MODE === "wix") {
      const items = await wixCall(op, args);
      ROSTER = rosterFromCMS(items); S.cmsEmpty = !items.length;
    } else { applyLocal(op, args); store("hot16_local_roster", ROSTER); }
    toast(okMsg); await refresh();
  } catch (e) { toast("Not saved: " + e.message, 6000); }
}
async function refresh() { await rebuildBench(); renderHeader(); renderStandards(); }

  };
  $("#rq").oninput = draw; $("#rall").onchange = draw; draw();
  const tiers = [["artist", "Hip hop & rap artists"], ["industry", "Singers, DJs, radio & industry"], ["publication", "Publications, celebrities & fan polls"]];
  $("#rsrc").innerHTML = tiers.map(([t, label]) => `<h4>${label}</h4><ul>${D.ranking_sources.filter(l => l.tier === t).sort((a, b) => a.by.toLowerCase() < b.by.toLowerCase() ? -1 : 1)
    .map(l => `<li><b>${esc(l.by)}</b> — ${esc(l.role || "")} (${l.year || "n.d."}${l.label ? ", " + esc(l.label) : ""}) — <a href="${esc(l.source)}" target="_blank" rel="noopener">source</a></li>`).join("")}</ul>`).join("");
}

  <h3>Sources</h3><ul>${Object.entries(T.sources || {}).map(([k, v]) => `<li><b>${esc(SS[k] || k)}</b> — ${esc(v.cite)} (${esc(v.type)}) — <a href="${esc(v.url)}" target="_blank" rel="noopener">link</a></li>`).join("")}</ul>`;

/* ---------------------------------------------------------------- tab: guidelines */
function renderGuide() {
  const G = D.guidelines, W = H16.WEIGHTS;
  let h = `<h2>Embedded guidelines</h2>`;
  for (const sec of ["general", "wordplay_rules", "rhyme_rules"]) h += `<h4>${sec.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase())}</h4><ul>${G[sec].map(r => `<li>${esc(r)}</li>`).join("")}</ul>`;
  h += `<h4>Category rules</h4><ul>${Object.entries(G.category_rules).map(([k, v]) => `<li><b>${esc(CAT(k).name)}</b> — ${esc(v)}</li>`).join("")}</ul>`;
  h += `<h2>How a 16 is graded</h2><ol>
    <li>Every technique earns points per instance up to its cap. Rule-based guesses (entendres, punchlines, metaphors, mind rhymes) earn partial credit (10-40% depending on the technique, max 30% of the cap).</li>
    <li>Points roll up into five dimensions (0-100): ${Object.values(H16.DIMS).map(v => `${esc(v.label)} (100 = ${v.target} pts)`).join(", ")}.</li>
    <li>Overall = weighted dimensions + penalties (${Object.entries(W).map(([k, v]) => `${esc(H16.DIMS[k].label)} ${pct(v)}`).join(", ")}). Each category re-weights the dimensions and adds a small bonus for style evidence read in context. Values were calibrated against the locked Hot 16s.</li>
    <li>Verses over 16 bars are split into 16-bar sections, each graded in full; the whole-verse score is their bar-weighted average.</li>
    <li>The Master Standard = the rank-weighted average of the locked-in Hot 16s (1st place ×3, 2nd ×2, 3rd ×1, times 1 + rank score). Any 16 is compared to it as an index (100 = equal), per category and overall.</li></ol>`;
  $("#t-guide").innerHTML = h;
}
