<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline</title>
<!--
  Timeline — Wix "Embed HTML" version
  ------------------------------------------------------------------
  Paste this whole file into a Wix Embed HTML element (Embed Code → Code)
  and give that element the ID  #htmlTimeline.

  This box draws the timeline, date picker, search and preview.
  It has no data of its own: every lookup is sent to the page code
  (pages/Home.js, not set as home page), which asks the backend (curated events + your CMS)
  and sends the answer back. The "Suggest a new entry" box sends a
  visitor's suggestion to the AI fact-check and shows the result.
  The "← American Griot One" button at the top sends { type: 'nav' };
  pages/Home.js opens the landing page.
-->
<style>
  :root {
    --page-bg: #f3efe6;
    --ink: #1f2937;
    --muted: #6b7280;
    --accent: #c2410c;
    --field-border: #d6cbb3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page-bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  .bar input, .bar button { font: inherit; padding: 8px 10px; border: 1px solid var(--field-border); border-radius: 8px; background: #fff; color: var(--ink); }
  .bar input[type="search"] { flex: 1 1 260px; min-width: 0; }
  .bar button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  .bar button:disabled { opacity: .6; cursor: default; }
  .bar button.alt { background: #fff; color: var(--accent); }
  #status { font-size: 13px; color: var(--muted); min-height: 18px; margin-bottom: 8px; }
  timeline-ruler { height: 420px; }
  .grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 16px; margin-top: 16px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); min-width: 0; }
  .card h2 { margin: 4px 0 6px; font-size: 20px; line-height: 1.3; }
  .card p { margin: 0 0 12px; line-height: 1.5; }
  .muted { color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: #fff1e6; color: var(--accent); font-size: 11px; font-weight: 700; }
  #results { max-height: 300px; overflow-y: auto; margin-top: 6px; }
  #results button { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: 8px; border-radius: 6px; cursor: pointer; }
  #results button:hover, #results button.on { background: #f5f5f4; }
  #results b { display: block; font-size: 14px; }
  #preview img { display: block; width: 100%; max-height: 260px; object-fit: cover; border-radius: 8px; margin: 8px 0 12px; }
  .stamp { display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 8px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid; }
  .stamp.hi { background: #f0fdf4; color: #166534; border-color: #86efac; }
  .stamp.mid { background: #fffbeb; color: #854d0e; border-color: #fcd34d; }
  .stamp.lo { background: #fef2f2; color: #991b1b; border-color: #fca5a5; }
  .vnotes { font-size: 12px; color: var(--muted); margin: -2px 0 10px; line-height: 1.45; }
  .srcs { font-size: 12px; margin: 0 0 12px; }
  .srcs a { color: var(--accent); margin-right: 10px; }
  .impact { border-top: 1px solid #eee; margin: 4px 0 12px; padding-top: 10px; }
  .impact .hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 700; }
  .imp { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; }
  .imp.gain { background: #e0f2fe; color: #075985; }
  .imp.setback { background: #f3f4f6; color: #374151; }
  .imp.mixed { background: #fef3c7; color: #854d0e; }
  .imp.neutral { background: #f5f5f4; color: #57534e; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; font-variant-numeric: tabular-nums; border: 1px solid; }
  .chip.up { background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }
  .chip.down { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
  .impact .note { font-size: 13px; color: #44403c; margin: 4px 0 6px; line-height: 1.45; }
  .chain { font-size: 12.5px; margin: 3px 0; line-height: 1.5; }
  .chain .lbl { color: var(--muted); }
  .chain button { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; text-align: left; }
  .full { font: inherit; padding: 8px 12px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  /* suggestion box */
  .suggest { margin-top: 16px; }
  .suggest[hidden] { display: none; }
  .suggest h2 { margin-top: 0; }
  .suggest form { display: grid; gap: 10px; max-width: 760px; }
  .suggest label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
  .suggest input, .suggest select, .suggest textarea { font: inherit; font-weight: 400; padding: 8px 10px; border: 1px solid var(--field-border); border-radius: 8px; background: #fff; color: var(--ink); width: 100%; }
  .suggest textarea { resize: vertical; min-height: 72px; }
  .sg-date { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; }
  .sg-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .sg-btn { font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  .sg-btn.alt { background: #fff; color: var(--accent); }
  .sg-btn:disabled { opacity: .6; cursor: default; }
  .sg-count { font-size: 12px; color: var(--muted); font-weight: 400; justify-self: end; }
  .sg-msg { margin-top: 12px; padding: 12px; border-radius: 8px; background: #f5f5f4; line-height: 1.5; }
  .sg-msg.ok { background: #f0fdf4; border: 1px solid #86efac; }
  .sg-msg.no { background: #fef2f2; border: 1px solid #fca5a5; }
  .sg-msg h3 { margin: 4px 0 6px; font-size: 17px; }
  .sg-msg[hidden], .suggest [hidden] { display: none !important; }
  .spin2 { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px; border: 2px solid #e7e5e4; border-top-color: var(--accent); border-radius: 50%; animation: sgspin .8s linear infinite; }
  @keyframes sgspin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin2 { animation: none; } }
  #results .invite { color: var(--accent); font-weight: 600; }
  /* back to the American Griot One landing page */
  .back { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 12px; padding: 7px 14px; font: inherit; font-size: 14px; font-weight: 600;
    color: var(--accent); background: #fff; border: 1px solid var(--field-border); border-radius: 999px; cursor: pointer; }
  .back:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <button id="backAgo" class="back" type="button">← American Griot One</button>
  <div class="bar">
    <input id="date" type="date" aria-label="Choose a date">
    <button id="goDate">Go to date</button>
    <input id="q" type="search" placeholder="Search a person, place or thing — or a year or date" aria-label="Search">
    <button id="search">Search</button>
    <button id="graphBtn" class="alt" type="button">Growth graph →</button>
  </div>
  <div id="status" role="status"></div>
  <timeline-ruler id="tl" start-year="1300" years-ahead="2"></timeline-ruler>
  <div class="grid">
    <div class="card"><div class="muted">Search results</div><div id="results"></div></div>
    <div class="card" id="preview"></div>
  </div>
  <section class="card suggest" id="suggest" hidden aria-labelledby="sgTitle">
    <h2 id="sgTitle">Suggest a new entry</h2>
    <p class="muted" id="sgNote"></p>
    <div class="sg-msg" id="sgPaused" hidden>New suggestions are paused right now. Please check back later.</div>
    <form id="sgForm" novalidate>
      <label>Name of the Black American, place, event or thing
        <input id="sgName" maxlength="80" autocomplete="off" placeholder="e.g. Bessie Coleman">
      </label>
      <div class="sg-date">
        <label>Year <input id="sgYear" type="number" inputmode="numeric" placeholder="e.g. 1922"></label>
        <label>Month (optional)
          <select id="sgMonth"><option value="">—</option></select>
        </label>
        <label>Day (optional) <input id="sgDay" type="number" inputmode="numeric" min="1" max="31"></label>
      </div>
      <label>What happened? Keep it short.
        <textarea id="sgText" maxlength="280" placeholder="One or two sentences about what happened and why it matters."></textarea>
        <span class="sg-count" id="sgCount"></span>
      </label>
      <div class="sg-row">
        <button class="sg-btn" type="submit" id="sgSend">Check and submit</button>
        <button class="sg-btn alt" type="button" id="sgLogin" hidden>Log in to suggest an entry</button>
      </div>
    </form>
    <div id="sgResult" aria-live="polite"></div>
  </section>
</main>

<script>
/* Ruler drawing code: horizontal, ruler-style timeline with drop-down event lists. */

(function () {
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const PAD = 140;          // empty space before the first and after the last year (px)
  const DROP_W = 320;       // drop-down width (px)

  /** The ruler always ends `ahead` years after the current calendar year (2026 → 2028). */
  function computeEndYear(ahead, now) {
    return (now || new Date()).getFullYear() + ahead;
  }
  function safeJSON(v, fallback) {
    if (v == null || v === '') return fallback;
    try { return JSON.parse(v); } catch (e) { return fallback; }
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function ordinal(n) {
    const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  function shortDate(ev) {
    if (ev.month && ev.day) return MONTHS[ev.month - 1] + ' ' + ev.day;
    if (ev.month) return MONTHS[ev.month - 1];
    return 'Year';
  }
  // "% verified" badge: green 85+, amber 70-84, red below 70. The word is in the tooltip, so colour is never the only cue.
  function pctBadge(ev) {
    const c = parseInt(ev.confidence, 10);
    if (!Number.isFinite(c)) return '';
    const cls = c >= 85 ? 'hi' : c >= 70 ? 'mid' : 'lo';
    const word = ev.verification || (c >= 85 ? 'Verified' : c >= 70 ? 'Partly verified' : 'Needs source');
    return `<span class="pct ${cls}" title="${esc(word)}: ${c}% confidence">${c}%</span>`;
  }
  function sortEvents(list) {
    return (list || []).slice().sort((a, b) =>
      ((a.month || 0) * 100 + (a.day || 0)) - ((b.month || 0) * 100 + (b.day || 0)));
  }

  const CSS = `
  :host {
    --ink: #2b2118;
    --ink-soft: #6b5a48;
    --ruler-top: #f6e7bf;
    --ruler-bottom: #e6cf95;
    --ruler-edge: #b8964f;
    --accent: #c2410c;
    --accent-soft: rgba(194, 65, 12, .14);
    --future: #1d4ed8;
    --panel-bg: #ffffff;
    --panel-ink: #1f2937;
    --panel-muted: #6b7280;
    --panel-border: #e5e7eb;
    --stage-bg: #faf7f0;
    --ruler-h: 104px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: block; height: 100%; min-height: 300px; position: relative;
    font-family: var(--font); color: var(--ink); user-select: none;
  }
  * { box-sizing: border-box; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--stage-bg); border-radius: 10px; overflow: hidden; }
  .stage { position: relative; flex: 1; min-height: 0; }
  .viewport { position: absolute; inset: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; cursor: grab; outline: none; }
  .viewport.dragging { cursor: grabbing; }
  .viewport::-webkit-scrollbar { height: 8px; }
  .viewport::-webkit-scrollbar-thumb { background: var(--ruler-edge); border-radius: 4px; }
  .track { position: relative; height: 100%; }

  /* ── the ruler band ── */
  .ruler { position: absolute; top: 0; left: 0; height: var(--ruler-h);
    background: linear-gradient(var(--ruler-top), var(--ruler-bottom));
    border-bottom: 3px solid var(--ruler-edge);
    box-shadow: 0 6px 14px rgba(60, 40, 10, .18); }
  .ruler .q, .ruler .h { position: absolute; top: 0; pointer-events: none; }
  .ruler .q { height: 10px;   /* quarter-year ticks */
    background-image: repeating-linear-gradient(90deg, var(--ink-soft) 0 1px, transparent 1px calc(var(--ppy) * .25px)); }
  .ruler .h { height: 18px;   /* half-year ticks */
    background-image: repeating-linear-gradient(90deg, var(--ink-soft) 0 1px, transparent 1px calc(var(--ppy) * 1px));
    background-position-x: calc(var(--ppy) * .5px); }

  .markers { position: absolute; top: 0; left: 0; height: var(--ruler-h); }
  .yr { position: absolute; top: 0; height: var(--ruler-h); padding: 0; margin: 0; border: 0;
    background: transparent; cursor: pointer; font: inherit; color: inherit; text-align: left; }
  .yr:hover { background: rgba(255, 255, 255, .35); }
  .yr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .yr.sel { background: var(--accent-soft); }
  .yr .tick { position: absolute; left: 0; top: 0; width: 1.5px; height: 28px; background: var(--ink); }
  .yr.decade .tick { height: 44px; width: 2px; }
  .yr.century .tick { height: 64px; width: 3px; }
  .yr .lbl { position: absolute; left: 6px; top: 30px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .yr.decade .lbl { top: 46px; font-size: 15px; font-weight: 800; }
  .yr.century .lbl { top: 64px; font-size: 19px; font-weight: 900; }
  .yr.future .lbl { color: var(--future); }
  .yr .cnt { position: absolute; left: 6px; bottom: 7px; min-width: 18px; height: 16px; padding: 0 5px;
    border-radius: 8px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700;
    line-height: 16px; text-align: center; }
  .yr.decade .cnt, .yr.century .cnt { left: auto; right: 8px; }

  .today, .pin { position: absolute; top: 0; height: var(--ruler-h); pointer-events: none; }
  .today { width: 2px; background: #dc2626; }
  .today::after { content: 'Today'; position: absolute; top: 2px; left: 4px; font-size: 10px; font-weight: 700; color: #dc2626; }
  .pin { width: 0; display: none; }
  .pin.on { display: block; }
  .pin::before { content: ''; position: absolute; left: -1px; top: 0; width: 3px; height: 100%; background: var(--accent); }
  .pin::after { content: ''; position: absolute; left: -7px; top: calc(var(--ruler-h) - 6px); width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(194, 65, 12, .6); animation: pulse 1.4s ease-out 3; }
  @keyframes pulse { to { box-shadow: 0 0 0 14px rgba(194, 65, 12, 0); } }

  /* ── drop-down list ── */
  .drop { position: absolute; top: calc(var(--ruler-h) + 14px); width: ${DROP_W}px; max-height: calc(100% - var(--ruler-h) - 26px);
    display: none; flex-direction: column; background: var(--panel-bg); color: var(--panel-ink);
    border: 1px solid var(--panel-border); border-radius: 10px; box-shadow: 0 12px 30px rgba(0, 0, 0, .18);
    cursor: default; user-select: text; z-index: 5; }
  .drop.on { display: flex; animation: drop .18s ease-out; }
  @keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
  .drop::before { content: ''; position: absolute; top: -7px; left: var(--caret, 16px); width: 12px; height: 12px;
    background: var(--panel-bg); border-left: 1px solid var(--panel-border); border-top: 1px solid var(--panel-border); transform: rotate(45deg); }
  .drop header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--panel-border); }
  .drop header b { font-size: 18px; }
  .drop header span { color: var(--panel-muted); font-size: 12px; flex: 1; }
  .drop .x { border: 0; background: transparent; font-size: 20px; line-height: 1; cursor: pointer; color: var(--panel-muted); padding: 2px 6px; border-radius: 6px; }
  .drop .x:hover { background: #f3f4f6; }
  .drop ul { list-style: none; margin: 0; padding: 4px; overflow-y: auto; }
  .ev { display: flex; gap: 10px; align-items: baseline; padding: 8px; border-radius: 7px; cursor: pointer; }
  .ev:hover { background: #f5f5f4; }
  .ev .d { flex: 0 0 52px; font-size: 12px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .ev .t { font-size: 14px; line-height: 1.3; flex: 1; }
  .pct { flex: 0 0 auto; align-self: center; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .pct.hi { background: #dcfce7; color: #166534; }
  .pct.mid { background: #fef3c7; color: #854d0e; }
  .pct.lo { background: #fee2e2; color: #991b1b; }
  .ev.hl { background: #fff1e6; box-shadow: inset 3px 0 0 var(--accent); animation: flash 1.2s ease-out 2; }
  .ev.active { background: #fde8d7; }
  @keyframes flash { 50% { background: #fed7aa; } }
  .msg { padding: 16px 14px; font-size: 14px; color: var(--panel-muted); line-height: 1.45; }
  .spin { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px; border-radius: 50%;
    border: 2px solid #e5e7eb; border-top-color: var(--accent); animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ── overlays: era badge + arrows ── */
  .badge { position: absolute; left: 52px; bottom: 10px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
    background: rgba(43, 33, 24, .82); color: #fff; pointer-events: none; z-index: 6; }
  .nav { position: absolute; top: calc(var(--ruler-h) / 2 - 18px); width: 36px; height: 36px; border-radius: 50%; z-index: 6;
    border: 1px solid var(--ruler-edge); background: rgba(255, 255, 255, .92); color: var(--ink); font-size: 20px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .15); }
  .nav:hover { background: #fff; }
  .prev { left: 8px; } .next { right: 8px; }

  /* ── overview bar (whole span) ── */
  .overview { position: relative; flex: 0 0 30px; background: #efe6d2; border-top: 1px solid #dccca6; cursor: pointer; touch-action: none; }
  .overview .c { position: absolute; top: 0; height: 100%; border-left: 1px solid #c9b48a; font-size: 10px; padding: 9px 0 0 3px; color: var(--ink-soft); pointer-events: none; white-space: nowrap; }
  .overview .thumb { position: absolute; top: 3px; bottom: 3px; min-width: 6px; border-radius: 4px; background: var(--accent-soft); border: 2px solid var(--accent); pointer-events: none; }
  .overview .now { position: absolute; top: 0; bottom: 0; width: 2px; background: #dc2626; pointer-events: none; }

  @media (max-width: 520px) {
    .drop { width: min(${DROP_W}px, calc(100vw - 32px)); }
    .overview .c:nth-child(odd) { color: transparent; }
  }
  `;

  class TimelineRuler extends HTMLElement {
    static get observedAttributes() {
      return ['start-year', 'end-year', 'years-ahead', 'px-per-year', 'counts', 'year-events', 'command'];
    }

    constructor() {
      super();
      this.root = this.attachShadow({ mode: 'open' });
      this.startYear = 1300;
      this.yearsAhead = 2;
      this.endYear = computeEndYear(2);
      this.ppy = 96;
      this.counts = {};
      this.cache = new Map();      // year → {status, events, message}
      this.openYear = null;
      this.selectedYear = null;
      this.highlightId = null;
      this.activeId = null;
      this.range = [0, 0];
      this.anim = null;
      this.lastNonce = null;
      this._raf = 0;
      this._built = false;
    }

    /* ───────── lifecycle ───────── */
    connectedCallback() {
      if (this._built) return;
      this._built = true;
      this.readAttrs();
      this.build();
      this.bind();
      this.layout();
      const initial = parseInt(this.getAttribute('initial-year'), 10) || new Date().getFullYear();
      requestAnimationFrame(() => {
        this.vp.scrollLeft = this.scrollTargetFor(initial + 0.5, false);
        this.onScroll(true);
        this.emit('ready', { startYear: this.startYear, endYear: this.endYear });
      });
      // Re-check every hour so the end year moves forward when a new calendar year starts.
      this._dayTimer = setInterval(() => {
        const e = computeEndYear(this.yearsAhead);
        if (e !== this.endYear) { this.endYear = e; this.layout(); this.onScroll(true); }
      }, 60 * 60 * 1000);
    }

    disconnectedCallback() {
      clearInterval(this._dayTimer);
      if (this._ro) this._ro.disconnect();
    }

    attributeChangedCallback(name, oldV, newV) {
      if (name === 'counts') this.counts = safeJSON(newV, {}) || {};
      if (!this._built) return;
      switch (name) {
        case 'counts': this.onScroll(true); this.renderDrop(); break;
        case 'year-events': this.onYearEvents(safeJSON(newV, null)); break;
        case 'command': this.onCommand(safeJSON(newV, null)); break;
        default: this.readAttrs(); this.layout(); this.onScroll(true);
      }
    }

    readAttrs() {
      const s = parseInt(this.getAttribute('start-year'), 10);
      if (!isNaN(s)) this.startYear = s;
      const a = parseInt(this.getAttribute('years-ahead'), 10);
      if (!isNaN(a)) this.yearsAhead = clamp(a, 0, 50);
      this.endYear = computeEndYear(this.yearsAhead);
      // The page may also send an exact end year (from the backend); use it when present.
      const e = parseInt(this.getAttribute('end-year'), 10);
      if (!isNaN(e) && e >= this.startYear) this.endYear = e;
      const p = parseInt(this.getAttribute('px-per-year'), 10);
      if (!isNaN(p)) this.ppy = clamp(p, 48, 400);
      this.counts = safeJSON(this.getAttribute('counts'), this.counts) || {};
    }

    /* ───────── DOM ───────── */
    build() {
      this.root.innerHTML = `
        <style>${CSS}</style>
        <div class="wrap">
          <div class="stage">
            <div class="viewport" tabindex="0" aria-label="Timeline. Use arrow keys to scroll.">
              <div class="track">
                <div class="ruler"><div class="q"></div><div class="h"></div></div>
                <div class="markers" role="list"></div>
                <div class="today" aria-hidden="true"></div>
                <div class="pin" aria-hidden="true"></div>
                <div class="drop" role="dialog" aria-live="polite"></div>
              </div>
            </div>
            <button class="nav prev" aria-label="Scroll back in time">&#8249;</button>
            <button class="nav next" aria-label="Scroll forward in time">&#8250;</button>
            <div class="badge"></div>
          </div>
          <div class="overview" aria-label="Jump to a century"><div class="thumb"></div><div class="now"></div></div>
        </div>`;
      const $ = sel => this.root.querySelector(sel);
      this.vp = $('.viewport');
      this.track = $('.track');
      this.ruler = $('.ruler');
      this.markers = $('.markers');
      this.todayEl = $('.today');
      this.pinEl = $('.pin');
      this.drop = $('.drop');
      this.badge = $('.badge');
      this.overview = $('.overview');
      this.thumb = $('.overview .thumb');
      this.nowEl = $('.overview .now');
    }

    layout() {
      const years = this.endYear - this.startYear + 1;
      const width = PAD * 2 + years * this.ppy;
      this.style.setProperty('--ppy', this.ppy);
      this.track.style.width = width + 'px';
      this.ruler.style.width = width + 'px';
      this.markers.style.width = width + 'px';
      this.root.querySelectorAll('.ruler .q, .ruler .h').forEach(el => {
        el.style.left = PAD + 'px';
        el.style.width = (years * this.ppy) + 'px';
      });

      // today marker
      const now = new Date();
      const startOfYear = new Date(now.getFullYear(), 0, 1);
      const frac = (now - startOfYear) / (365.25 * 864e5);
      const nowX = this.xOf(now.getFullYear() + frac);
      this.todayEl.style.left = nowX + 'px';
      this.todayEl.style.display = now.getFullYear() >= this.startYear && now.getFullYear() <= this.endYear ? '' : 'none';

      // overview centuries
      this.overview.querySelectorAll('.c').forEach(n => n.remove());
      const span = this.endYear + 1 - this.startYear;
      const firstC = Math.ceil(this.startYear / 100) * 100;
      let html = '';
      for (let c = firstC; c <= this.endYear; c += 100) {
        html += `<div class="c" style="left:${((c - this.startYear) / span) * 100}%">${c}</div>`;
      }
      this.overview.insertAdjacentHTML('afterbegin', html);
      this.nowEl.style.left = (((now.getFullYear() + frac) - this.startYear) / span) * 100 + '%';
    }

    /* ───────── geometry ───────── */
    xOf(yearFloat) { return PAD + (yearFloat - this.startYear) * this.ppy; }
    yearAt(x) { return this.startYear + (x - PAD) / this.ppy; }
    fraction(month, day) {
      if (!month) return 0.5;
      return ((month - 1) + (day ? (day - 0.5) / 31 : 0.5)) / 12;
    }
    scrollTargetFor(yearFloat, withDrop) {
      const vw = this.vp.clientWidth;
      const x = this.xOf(yearFloat);
      // When a drop-down will open, centre the drop-down rather than the tick.
      const anchor = withDrop ? this.xOf(Math.floor(yearFloat)) + Math.min(DROP_W, vw - 32) / 2 : x;
      return clamp(anchor - vw / 2, 0, this.vp.scrollWidth - vw);
    }

    /* ───────── rendering ───────── */
    onScroll(force) {
      const vw = this.vp.clientWidth, sl = this.vp.scrollLeft;
      const first = Math.max(this.startYear, Math.floor(this.yearAt(sl)) - 4);
      const last = Math.min(this.endYear, Math.ceil(this.yearAt(sl + vw)) + 4);
      if (force || first !== this.range[0] || last !== this.range[1]) {
        this.range = [first, last];
        this.renderMarkers(first, last);
      }
      // era badge
      const center = Math.floor(this.yearAt(sl + vw / 2));
      const c = clamp(center, this.startYear, this.endYear);
      const cent = Math.floor(c / 100) * 100;
      this.badge.textContent = `${cent}s · ${ordinal(Math.floor(c / 100) + 1)} century`;
      // overview thumb
      const sw = this.vp.scrollWidth || 1;
      this.thumb.style.left = (sl / sw) * 100 + '%';
      this.thumb.style.width = (vw / sw) * 100 + '%';
      // notify page (throttled)
      clearTimeout(this._vcT);
      this._vcT = setTimeout(() => this.emit('view-change', { centerYear: c }), 250);
    }

    renderMarkers(first, last) {
      const nowYear = new Date().getFullYear();
      let html = '';
      for (let y = first; y <= last; y++) {
        let cls = 'yr';
        if (y % 100 === 0) cls += ' century';
        else if (y % 10 === 0) cls += ' decade';
        if (y === this.selectedYear) cls += ' sel';
        if (y > nowYear) cls += ' future';
        const n = this.counts[y] || 0;
        html += `<button class="${cls}" role="listitem" data-year="${y}" style="left:${this.xOf(y)}px;width:${this.ppy}px"
          aria-label="Year ${y}${n ? ', ' + n + ' events' : ''}"><span class="tick"></span><span class="lbl">${y}</span>${
          n ? `<span class="cnt">${n > 99 ? '99+' : n}</span>` : ''}</button>`;
      }
      this.markers.innerHTML = html;
    }

    renderDrop() {
      const y = this.openYear;
      if (y == null) { this.drop.classList.remove('on'); return; }
      const data = this.cache.get(y) || { status: 'loading' };
      const events = sortEvents(data.events);
      let body;
      if (data.status === 'loading') {
        body = `<div class="msg"><span class="spin"></span>Loading ${y}…</div>`;
      } else if (data.status === 'researching') {
        body = `<div class="msg"><span class="spin"></span>${esc(data.message || 'Nothing saved for this year yet. Researching with AI…')}</div>`;
      } else if (data.status === 'error') {
        body = `<div class="msg">${esc(data.message || 'Something went wrong. Please try again.')}</div>`;
      } else if (!events.length) {
        body = `<div class="msg">${esc(data.message || (y > new Date().getFullYear()
          ? 'This year is still in the future — no recorded events yet.'
          : 'No events recorded for this year yet.'))}</div>`;
      } else {
        body = '<ul>' + events.map(ev => `
          <li class="ev${ev._id === this.highlightId ? ' hl' : ''}${ev._id === this.activeId ? ' active' : ''}" data-id="${esc(ev._id)}" tabindex="0">
            <span class="d">${esc(shortDate(ev))}</span><span class="t">${esc(ev.title)}</span>${pctBadge(ev)}
          </li>`).join('') + '</ul>';
      }
      const count = events.length;
      this.drop.innerHTML = `
        <header><b>${y}</b><span>${count ? count + (count === 1 ? ' event' : ' events') : ''}</span>
          <button class="x" aria-label="Close">&times;</button></header>${body}`;

      // position under the year, kept inside the track
      const trackW = this.track.offsetWidth;
      const x = this.xOf(y);
      const w = Math.min(DROP_W, this.vp.clientWidth - 32);
      const left = clamp(x, 8, trackW - w - 8);
      this.drop.style.left = left + 'px';
      this.drop.style.setProperty('--caret', clamp(x - left + 6, 10, w - 24) + 'px');
      this.drop.classList.add('on');

      // scroll the highlighted date into view inside the list
      const hl = this.drop.querySelector('.ev.hl');
      const ul = this.drop.querySelector('ul');
      if (hl && ul) {
        const top = hl.offsetTop - ul.clientHeight / 2 + hl.offsetHeight / 2;
        ul.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      }
    }

    setPin(year, month, day) {
      if (year == null || !month) { this.pinEl.classList.remove('on'); return; }
      this.pinEl.style.left = this.xOf(year + this.fraction(month, day)) + 'px';
      this.pinEl.classList.remove('on');
      void this.pinEl.offsetWidth;            // restart pulse animation
      this.pinEl.classList.add('on');
    }

    /* ───────── behaviour ───────── */
    openDrop(year, { emit = true } = {}) {
      this.openYear = year;
      this.selectedYear = year;
      this.onScroll(true);
      const cached = this.cache.get(year);
      if (!cached) this.cache.set(year, { status: 'loading', events: [] });
      this.renderDrop();
      this.ensureDropVisible();
      if (emit && (!cached || cached.status === 'error')) this.emit('year-select', { year });
    }

    closeDrop() {
      this.openYear = null;
      this.highlightId = null;
      this.drop.classList.remove('on');
      this.setPin(null);
    }

    ensureDropVisible() {
      const vw = this.vp.clientWidth, sl = this.vp.scrollLeft;
      const left = parseFloat(this.drop.style.left) || 0;
      const w = Math.min(DROP_W, vw - 32);
      if (left < sl + 8 || left + w > sl + vw - 8) {
        this.animateScroll(clamp(left + w / 2 - vw / 2, 0, this.vp.scrollWidth - vw));
      }
    }

    animateScroll(target, done) {
      this.stopAnim();
      const start = this.vp.scrollLeft;
      const dist = target - start;
      if (Math.abs(dist) < 1) { if (done) done(); return; }
      // Long jumps take longer, but never more than ~2s.
      const dur = clamp(380 + Math.sqrt(Math.abs(dist)) * 6, 380, 2000);
      const t0 = performance.now();
      let framed = false;
      const finish = () => {
        this.stopAnim();
        this.vp.scrollLeft = target;
        if (done) done();
      };
      const step = now => {
        framed = true;
        const t = clamp((now - t0) / dur, 0, 1);
        this.vp.scrollLeft = start + dist * ease(t);
        if (t < 1) this.anim = requestAnimationFrame(step);
        else { this.anim = null; clearTimeout(this.animGuard); if (done) done(); }
      };
      this.anim = requestAnimationFrame(step);
      // Browsers pause animation frames in a box that is off-screen (for example while the page
      // is still scrolling up from the graph). If no frame arrives, jump straight to the target.
      clearTimeout(this.animGuard);
      this.animGuard = setTimeout(() => { if (this.anim && !framed) finish(); }, 250);
    }
    stopAnim() {
      if (this.anim) cancelAnimationFrame(this.anim);
      this.anim = null;
      clearTimeout(this.animGuard);
    }

    /** Public method: slide to a year/date. Also reachable through the `command` attribute. */
    goTo({ year, month, day, events, highlightId, open = true, status, message } = {}) {
      year = parseInt(year, 10);
      if (isNaN(year)) return;
      year = clamp(year, this.startYear, this.endYear);
      if (events || status) {
        this.cache.set(year, { status: status || (events && events.length ? 'ready' : 'empty'), events: events || [], message });
      }
      this.highlightId = highlightId || null;
      this.activeId = highlightId || this.activeId;
      if (this.openYear !== year) { this.drop.classList.remove('on'); this.openYear = null; }
      this.setPin(null);
      const target = this.scrollTargetFor(year + this.fraction(month, day), open);
      this.animateScroll(target, () => {
        this.setPin(year, month, day);
        if (open) this.openDrop(year, { emit: !events && !status });
        else { this.selectedYear = year; this.onScroll(true); }
      });
    }

    onCommand(cmd) {
      if (!cmd || (cmd.nonce != null && cmd.nonce === this.lastNonce)) return;
      this.lastNonce = cmd.nonce;
      if (cmd.type === 'goto') this.goTo(cmd);
      else if (cmd.type === 'close') this.closeDrop();
      else if (cmd.type === 'clear-cache') { this.cache.clear(); if (this.openYear != null) this.openDrop(this.openYear); }
    }

    onYearEvents(p) {
      if (!p || p.year == null) return;
      const y = parseInt(p.year, 10);
      this.cache.set(y, { status: p.status || 'ready', events: p.events || [], message: p.message });
      if (p.highlightId) { this.highlightId = p.highlightId; this.activeId = p.highlightId; }
      if (p.events && p.events.length && (p.status || 'ready') === 'ready') {
        this.counts[y] = p.events.length;
        this.onScroll(true);
      }
      if (this.openYear === y) this.renderDrop();
    }

    emit(name, detail) {
      this.dispatchEvent(new CustomEvent(name, { detail, bubbles: true, composed: true }));
    }

    /* ───────── input ───────── */
    bind() {
      this.vp.addEventListener('scroll', () => {
        cancelAnimationFrame(this._raf);
        this._raf = requestAnimationFrame(() => this.onScroll(false));
      }, { passive: true });

      if ('ResizeObserver' in window) {
        this._ro = new ResizeObserver(() => { this.onScroll(true); if (this.openYear != null) this.renderDrop(); });
        this._ro.observe(this.vp);
      }

      // Mouse wheel → horizontal scroll (vertical wheel still scrolls the drop-down list)
      this.vp.addEventListener('wheel', e => {
        if (e.target.closest && e.target.closest('.drop ul')) return;
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
          e.preventDefault();
          this.stopAnim();
          this.vp.scrollLeft += e.deltaY * (e.deltaMode === 1 ? 32 : 1);
        }
      }, { passive: false });

      // Click-and-drag scrolling for mouse users (touch uses native scrolling)
      let drag = null;
      this.vp.addEventListener('pointerdown', e => {
        if (e.pointerType !== 'mouse' || e.button !== 0) return;
        if (e.target.closest && e.target.closest('.drop')) return;
        this.stopAnim();
        drag = { x: e.clientX, sl: this.vp.scrollLeft, moved: false };
      });
      window.addEventListener('pointermove', e => {
        if (!drag) return;
        const dx = e.clientX - drag.x;
        if (Math.abs(dx) > 4) { drag.moved = true; this.vp.classList.add('dragging'); }
        if (drag.moved) this.vp.scrollLeft = drag.sl - dx;
      });
      window.addEventListener('pointerup', () => {
        if (!drag) return;
        this._suppressClick = drag.moved;
        drag = null;
        this.vp.classList.remove('dragging');
      });
      this.vp.addEventListener('touchstart', () => this.stopAnim(), { passive: true });

      // Clicks (delegated)
      this.root.addEventListener('click', e => {
        if (this._suppressClick) { this._suppressClick = false; return; }
        const t = e.target;
        const yr = t.closest('.yr');
        if (yr) {
          const y = parseInt(yr.dataset.year, 10);
          if (this.openYear === y) this.closeDrop(); else { this.highlightId = null; this.setPin(null); this.openDrop(y); }
          return;
        }
        const ev = t.closest('.ev');
        if (ev) { this.selectEvent(ev.dataset.id); return; }
        if (t.closest('.x')) { this.closeDrop(); return; }
        if (t.closest('.prev')) { this.page(-1); return; }
        if (t.closest('.next')) { this.page(1); return; }
      });

      // Keyboard
      this.root.addEventListener('keydown', e => {
        const ev = e.target.closest && e.target.closest('.ev');
        if (ev && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); this.selectEvent(ev.dataset.id); return; }
        if (e.key === 'Escape') { this.closeDrop(); return; }
        if (e.target === this.vp) {
          if (e.key === 'ArrowRight') { e.preventDefault(); this.animateScroll(this.vp.scrollLeft + this.ppy * (e.shiftKey ? 10 : 1)); }
          if (e.key === 'ArrowLeft') { e.preventDefault(); this.animateScroll(this.vp.scrollLeft - this.ppy * (e.shiftKey ? 10 : 1)); }
        }
      });

      // Overview bar: click or drag to jump anywhere in the span
      let ov = false;
      const ovMove = e => {
        const r = this.overview.getBoundingClientRect();
        const f = clamp((e.clientX - r.left) / r.width, 0, 1);
        return clamp(f * this.vp.scrollWidth - this.vp.clientWidth / 2, 0, this.vp.scrollWidth - this.vp.clientWidth);
      };
      this.overview.addEventListener('pointerdown', e => {
        ov = true;
        this.overview.setPointerCapture(e.pointerId);
        this.animateScroll(ovMove(e));
      });
      this.overview.addEventListener('pointermove', e => { if (ov && e.buttons) { this.stopAnim(); this.vp.scrollLeft = ovMove(e); } });
      this.overview.addEventListener('pointerup', () => { ov = false; });
    }

    page(dir) {
      const vw = this.vp.clientWidth;
      this.animateScroll(clamp(this.vp.scrollLeft + dir * vw * 0.8, 0, this.vp.scrollWidth - vw));
    }

    selectEvent(id) {
      this.activeId = id;
      this.root.querySelectorAll('.ev').forEach(li => li.classList.toggle('active', li.dataset.id === id));
      this.emit('event-select', { id, year: this.openYear });
    }
  }

  if (!customElements.get('timeline-ruler')) customElements.define('timeline-ruler', TimelineRuler);
})();

</script>

<script>
(function () {
  // Optional hardening: put your site's address here, e.g. 'https://www.mysite.com'
  const SITE_ORIGIN = '*';

  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
    'August', 'September', 'October', 'November', 'December'];
  const POLL_EVERY_MS = 4000;
  const POLL_MAX_MS = 180000;

  const $ = id => document.getElementById(id);
  const tl = $('tl');
  let info = { startYear: 1300, endYear: new Date().getFullYear() + 2, counts: {} };
  let nonce = 0, callId = 0, previewToken = 0, started = false;
  let currentEvent = null;
  const pending = new Map();

  /* ───────── messaging with the Wix page code ───────── */
  function send(msg) { window.parent.postMessage({ source: 'timeline', ...msg }, SITE_ORIGIN); }

  /** Calls a backend function through the page code. */
  function call(method, ...args) {
    return new Promise((resolve, reject) => {
      const id = ++callId;
      pending.set(id, { resolve, reject });
      send({ type: 'call', id, method, args });
      setTimeout(() => {
        if (pending.has(id)) { pending.delete(id); reject(new Error('No answer from the page')); }
      }, 20000);
    });
  }

  // "← American Griot One": pages/Home.js opens /american-griot-one when it gets { type: 'nav' }
  $('backAgo').addEventListener('click', () => send({ type: 'nav' }));

  window.addEventListener('message', e => {
    const m = e.data;
    if (!m || m.source !== 'timeline-page') return;
    if (m.type === 'reply') {
      const p = pending.get(m.id);
      if (!p) return;
      pending.delete(m.id);
      if (m.error) p.reject(new Error(m.error)); else p.resolve(m.result);
    } else if (m.type === 'goto') {
      // Sent by the page when someone clicks "Show on timeline" on the growth graph.
      if (started) gotoFromGraph(m); else pendingGoto = m;   // run it once start-up finishes
    } else if (m.type === 'init' && !started) {
      started = true;
      start(m.info, m.query || {});
    } else if (m.type === 'loggedIn') {
      call('getSubmitSettings').then(s => { sub = s; renderSuggest(); }).catch(() => {});
    }
  });

  // "Growth graph" button: the page code opens the graph page (or scrolls to the graph if it is on this page).
  document.getElementById('graphBtn').addEventListener('click', () => send({ type: 'openGraph' }));

  // Handshake: keep saying "ready" until the page answers (its code may load after this box).
  (function hello(n) {
    if (started || n > 40) return;
    send({ type: 'ready' });
    setTimeout(() => hello(n + 1), 500);
  })(0);

  let pendingGoto = null;
  /** The graph sends the event's id, year, month and day, so the ruler starts moving right away. */
  function gotoFromGraph(m) {
    console.log('Timeline: showing event from the graph', m.id, m.year);
    const y = parseInt(m.year, 10);
    if (m.id && inRange(y)) goToEvent({ _id: m.id, year: y, month: num(m.month), day: num(m.day) });
    else if (m.id) call('getEventById', m.id).then(ev => ev ? goToEvent(ev) : flash('That event could not be found.')).catch(() => flash('That event could not be found.'));
    else if (inRange(y)) goToYear(y);
  }

  /* ───────── start-up ───────── */
  function start(i, query) {
    if (i) info = i;
    tl.setAttribute('start-year', String(info.startYear));
    tl.setAttribute('end-year', String(info.endYear));
    tl.setAttribute('counts', JSON.stringify(info.counts || {}));
    $('date').min = pad4(info.startYear) + '-01-01';
    $('date').max = pad4(info.endYear) + '-12-31';
    resetPreview('Pick a year on the ruler, choose a date, or search for a person, place or thing.');
    sub = info.submissions || null;
    renderSuggest();

    // Deep links: ?year=1492  ?year=1492&id=<itemId>  ?date=1776-07-04
    if (query.date && /^\d{4}-\d{2}-\d{2}$/.test(query.date)) {
      const [y, m, d] = query.date.split('-').map(Number);
      $('date').value = query.date;
      goToDate(y, m, d);
    } else if (query.year) {
      const y = parseInt(query.year, 10);
      if (query.id) call('getEventById', query.id).then(ev => ev ? goToEvent(ev) : goToYear(y)).catch(() => goToYear(y));
      else goToYear(y);
    }
    if (pendingGoto) { const g = pendingGoto; pendingGoto = null; gotoFromGraph(g); }
  }

  /* ───────── ruler wiring ───────── */
  const sendCommand = cmd => tl.setAttribute('command', JSON.stringify({ ...cmd, nonce: ++nonce }));
  const sendYear = p => tl.setAttribute('year-events', JSON.stringify(p));
  tl.addEventListener('year-select', e => loadYear(e.detail.year));
  tl.addEventListener('event-select', e => showPreview(e.detail.id));

  $('goDate').addEventListener('click', goFromDateInput);
  $('date').addEventListener('keydown', e => { if (e.key === 'Enter') goFromDateInput(); });
  $('search').addEventListener('click', () => runSearch($('q').value));
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch($('q').value); });

  function goFromDateInput() {
    const v = $('date').value;
    if (!v) return flash('Choose a date first.');
    const [y, m, d] = v.split('-').map(Number);
    goToDate(y, m, d);
  }

  /* ───────── navigation ───────── */
  async function goToYear(year) {
    if (!inRange(year)) return flash(`Enter a year between ${info.startYear} and ${info.endYear}.`);
    sendCommand({ type: 'goto', year, status: 'loading' });
    const events = await loadYear(year);
    if (events.length) resetPreview(`${year}: choose an event from the list on the timeline.`);
  }

  /** Loads a year into the ruler's drop-down. An empty year invites a suggestion. */
  async function loadYear(year, { highlightId } = {}) {
    sendYear({ year, status: 'loading' });
    try {
      const { events } = await call('getEventsForYear', year);
      if (!events.length) {
        sendYear({ year, status: 'empty', events: [], message: emptyText(String(year), year) });
        prefillSuggest({ year });
        return [];
      }
      sendYear({ year, status: 'ready', events, highlightId });
      return events;
    } catch (err) {
      console.error(err);
      setStatus('');
      sendYear({ year, status: 'error', events: [], message: 'Could not load this year. Please try again.' });
      return [];
    }
  }

  /** Slides to the year, opens its list, pins and highlights the exact date, and previews it. */
  async function goToDate(year, month, day) {
    if (!inRange(year)) return flash(`Choose a date between ${info.startYear} and ${info.endYear}.`);
    const label = `${MONTHS[month - 1]} ${day}, ${year}`;
    sendCommand({ type: 'goto', year, month, day, status: 'loading' });
    setStatus(`Looking up ${label}…`);
    try {
      const r = await call('getEventsForDate', year, month, day);
      setStatus('');
      if (!r.dateEvents.length) prefillSuggest({ year, month, day });
      const match = r.dateEvents[0];
      sendYear({
        year,
        status: r.yearEvents.length ? 'ready' : 'empty',
        events: r.yearEvents,
        highlightId: match ? match._id : null,
        message: r.yearEvents.length ? '' : emptyText(String(year), year),
      });
      if (match) showPreview(match._id);
      else resetPreview(`No recorded events on ${label}.` + (r.yearEvents.length ? ` Other events from ${year} are listed on the timeline.` : '') + (canSuggest() ? ' Know of one? Suggest it below.' : ''));
    } catch (err) {
      console.error(err);
      flash('Something went wrong looking up that date.');
    }
  }

  async function goToEvent(ev) {
    sendCommand({ type: 'goto', year: ev.year, month: ev.month, day: ev.day, status: 'loading', highlightId: ev._id });
    showPreview(ev._id);
    await loadYear(ev.year, { highlightId: ev._id });
  }

  /* ───────── search ───────── */
  async function runSearch(raw) {
    const text = String(raw || '').trim();
    if (text.length < 2 && !/^\d+$/.test(text)) return;
    if (/^\d{3,4}$/.test(text)) return goToYear(parseInt(text, 10));
    const d = parseDateText(text);
    if (d) return goToDate(d.year, d.month, d.day);

    $('search').disabled = true;
    setStatus(`Searching for “${text}”…`);
    try {
      const { results } = await call('searchEvents', text);
      if (!results.length) {
        showResults([], `Nothing on the timeline matches “${text}” yet.`, text);
        setStatus('');
        return;
      }
      setStatus('');
      showResults(results);
      goToEvent(results[0]);
    } catch (err) {
      console.error(err);
      setStatus('Search failed. Please try again.');
    } finally {
      $('search').disabled = false;
    }
  }

  function showResults(results, emptyMessage, query) {
    const box = $('results');
    box.innerHTML = '';
    if (!results.length) {
      box.innerHTML = `<div class="muted" style="padding:8px">${esc(emptyMessage || 'No matches.')}</div>`;
      if (query && canSuggest()) {
        const b = document.createElement('button');
        b.className = 'invite';
        b.textContent = `Suggest “${query}” as a new entry`;
        b.addEventListener('click', () => { prefillSuggest({ name: query }); openSuggest(); });
        box.appendChild(b);
      }
      return;
    }
    results.slice(0, 50).forEach((ev, i) => {
      const b = document.createElement('button');
      if (i === 0) b.className = 'on';
      b.innerHTML = `<b>${esc(ev.title)}</b><span class="muted">${esc(ev.dateLabel || ev.year)}</span>`;
      b.addEventListener('click', () => {
        box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
        goToEvent(ev);
      });
      box.appendChild(b);
    });
  }

  /** Understands "1776-07-04", "7/4/1776", "July 4, 1776" and "4 July 1776". */
  function parseDateText(t) {
    let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return mk(+m[1], +m[2], +m[3]);
    m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return mk(+m[3], +m[1], +m[2]);
    const idx = s => MONTHS.findIndex(n => n.toLowerCase().startsWith(s.toLowerCase().slice(0, 3)));
    m = t.match(/^([A-Za-z]+)\.?\s+(\d{1,2}),?\s+(\d{4})$/);
    if (m && m[1].length >= 3 && idx(m[1]) >= 0) return mk(+m[3], idx(m[1]) + 1, +m[2]);
    m = t.match(/^(\d{1,2})\s+([A-Za-z]+)\.?,?\s+(\d{4})$/);
    if (m && m[2].length >= 3 && idx(m[2]) >= 0) return mk(+m[3], idx(m[2]) + 1, +m[1]);
    return null;
    function mk(year, month, day) { return month >= 1 && month <= 12 && day >= 1 && day <= 31 ? { year, month, day } : null; }
  }

  function emptyText(what, year) {
    if (year > new Date().getFullYear()) return 'This year is still in the future — no recorded events yet.';
    return `No events recorded for ${what} yet.` + (canSuggest() ? ' Know of one? Suggest it in the box below the timeline.' : '');
  }

  /* ───────── "Suggest a new entry" (visitor suggestion → AI fact-check) ───────── */
  let sub = null;            // settings from the backend: visible, open, note, limits, login
  let sgBusy = false;
  const sgMonth = $('sgMonth');
  MONTHS.forEach((m, i) => { const o = document.createElement('option'); o.value = String(i + 1); o.textContent = m; sgMonth.appendChild(o); });

  function canSuggest() { return !!(sub && sub.visible && sub.open); }

  function renderSuggest() {
    const box = $('suggest');
    if (!sub || !sub.visible) { box.hidden = true; return; }
    box.hidden = false;
    $('sgNote').textContent = sub.note || '';
    $('sgName').maxLength = sub.maxNameLength || 80;
    $('sgText').maxLength = sub.maxTextLength || 280;
    $('sgYear').min = String(info.startYear);
    $('sgYear').max = String(new Date().getFullYear());
    $('sgPaused').hidden = !!sub.open;
    $('sgForm').hidden = !sub.open;
    const needLogin = sub.requireLogin && !sub.loggedIn;
    $('sgLogin').hidden = !needLogin;
    $('sgSend').hidden = needLogin;
    updateCount();
  }

  function updateCount() {
    const max = (sub && sub.maxTextLength) || 280;
    $('sgCount').textContent = `${$('sgText').value.length} / ${max} characters`;
  }
  $('sgText').addEventListener('input', updateCount);
  $('sgLogin').addEventListener('click', () => send({ type: 'login' }));

  function prefillSuggest({ name, year, month, day } = {}) {
    if (!canSuggest() || sgBusy) return;
    if (name) $('sgName').value = name;
    if (year) $('sgYear').value = String(year);
    if (month) $('sgMonth').value = String(month);
    if (day) $('sgDay').value = String(day);
  }
  function openSuggest() {
    $('suggest').scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(() => $('sgName').focus(), 400);
  }

  $('sgForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (sgBusy) return;
    const entry = {
      name: $('sgName').value.trim(),
      year: $('sgYear').value.trim(),
      month: $('sgMonth').value,
      day: $('sgDay').value.trim(),
      text: $('sgText').value.trim(),
    };
    // Quick checks here; the backend checks everything again.
    const y = parseInt(entry.year, 10), thisYear = new Date().getFullYear();
    if (entry.name.length < 2) return sgShow('no', 'Enter the name of the person, place or thing.');
    if (!(y >= info.startYear && y <= thisYear)) return sgShow('no', `Enter a year between ${info.startYear} and ${thisYear}.`);
    if (entry.day && !entry.month) return sgShow('no', 'Choose a month for that day, or leave the day blank.');
    if (entry.text.length < 10) return sgShow('no', 'Add a short description (at least 10 characters).');

    sgBusy = true;
    $('sgSend').disabled = true;
    sgShow('', '<span class="spin2"></span>Checking your suggestion against published sources. This can take up to a minute…', true);
    try {
      let r = await call('submitEntry', entry);
      if (r && r.state === 'checking') {
        const t0 = Date.now();
        while (Date.now() - t0 < POLL_MAX_MS) {
          await wait(POLL_EVERY_MS);
          let s2;
          try { s2 = await call('getEntryStatus', r.requestId); } catch (err) { continue; }
          if (s2.state === 'checking') continue;
          r = s2;
          break;
        }
        if (r.state === 'checking') r = { state: 'timeout' };
      }
      showOutcome(r || { state: 'error' });
    } catch (err) {
      console.error(err);
      showOutcome({ state: 'error' });
    } finally {
      sgBusy = false;
      $('sgSend').disabled = false;
    }
  });

  function showOutcome(r) {
    switch (r.state) {
      case 'approved': {
        sgShow('ok', `<div class="muted">Added to the timeline</div>${eventCard(r.event)}<p>${esc(r.reason || '')}</p>`, true, r.event);
        $('sgForm').reset(); updateCount();
        call('getTimelineInfo').then(i => { info = i; tl.setAttribute('counts', JSON.stringify(i.counts || {})); }).catch(() => {});
        break;
      }
      case 'pending':
        sgShow('ok', `<div class="muted">Waiting for review</div>${eventCard(r.event)}<p>${esc(r.reason || '')}</p>`, true);
        $('sgForm').reset(); updateCount();
        break;
      case 'declined':
        sgShow('no', `<h3>Not added</h3><p>${esc(r.reason || 'We could not verify this suggestion.')}</p>`, true, r.event, 'See the existing entry');
        break;
      case 'login':
        sub = { ...sub, requireLogin: true, loggedIn: false }; renderSuggest();
        sgShow('no', esc(r.reason || 'Please log in to suggest an entry.'), true);
        break;
      case 'closed':
        sub = { ...sub, open: false }; renderSuggest();
        sgShow('no', esc(r.reason || 'New suggestions are paused right now.'), true);
        break;
      case 'timeout':
        sgShow('no', 'The fact-check is taking longer than usual. If it is approved, it will appear on the timeline shortly.', true);
        break;
      case 'invalid': case 'limit':
        sgShow('no', esc(r.reason || 'Please check your entry.'), true);
        break;
      default:
        sgShow('no', esc(r.reason || 'The fact-check could not be completed. Please try again later.'), true);
    }
  }

  function eventCard(ev) {
    if (!ev) return '';
    const meta = [ev.dateLabel || ev.year, ev.category, ev.location].filter(Boolean).map(esc).join(' · ');
    return `<div class="muted">${meta}</div><h3>${esc(ev.title)}</h3>${stampHtml(ev)}<p>${esc(ev.summary || '')}</p>${sourcesHtml(ev)}`;
  }

  /** Shows a message (or HTML when trusted) under the form, with an optional "show on timeline" button. */
  function sgShow(kind, body, isHtml, ev, buttonText) {
    const box = $('sgResult');
    box.innerHTML = `<div class="sg-msg ${kind}">${isHtml ? body : esc(body)}</div>`;
    if (ev && ev._id) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'sg-btn alt'; b.textContent = buttonText || 'Show it on the timeline';
      b.addEventListener('click', () => { goToEvent(ev); tl.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
      box.firstElementChild.appendChild(b);
    }
  }

  /* ───────── preview (the display area) ───────── */
  async function showPreview(id) {
    const token = ++previewToken;
    $('preview').innerHTML = '<div class="muted">Preview</div><h2>Loading…</h2>';
    let ev = null;
    try { ev = await call('getEventById', id); } catch (e) { ev = null; }
    if (token !== previewToken) return;
    if (!ev) return resetPreview('That entry could not be loaded.');
    currentEvent = ev;
    const meta = [ev.dateLabel || ev.year, ev.category, ev.location].filter(Boolean).map(esc).join(' · ');
    const img = imageUrl(ev.image);
    $('preview').innerHTML = `
      <div class="muted">${meta}${ev.aiGenerated ? '<span class="tag">AI-researched</span>' : ''}</div>
      <h2>${esc(ev.title)}</h2>
      ${stampHtml(ev)}
      ${img ? `<img src="${esc(img)}" alt="">` : ''}
      <p>${esc(ev.summary || '')}</p>
      ${impactHtml(ev)}
      ${sourcesHtml(ev)}
      <button class="full" type="button">Read full page</button>`;
    $('preview').querySelectorAll('.chain button').forEach(b => b.addEventListener('click', async () => {
      let target = null;
      try { target = await call('getEventById', b.dataset.slug); } catch (e) { target = null; }
      if (target) goToEvent(target); else flash('That entry could not be loaded.');
    }));
    $('preview').querySelector('.full').addEventListener('click', () => {
      if (currentEvent && currentEvent.slug) {
        setStatus('Opening the full page…');
        send({ type: 'navigate', slug: currentEvent.slug, id: currentEvent._id });
      } else {
        flash('This event has no full-page address (slug) yet. Open the CMS and check its slug field.');
      }
    });
  }

  function resetPreview(message) {
    currentEvent = null;
    $('preview').innerHTML = `<div class="muted">Preview</div><h2>${esc(message)}</h2>`;
  }

  /* ───────── "% verified" stamp ───────── */
  function stampHtml(ev) {
    const c = parseInt(ev.confidence, 10);
    if (!Number.isFinite(c)) return '';
    const cls = c >= 85 ? 'hi' : c >= 70 ? 'mid' : 'lo';
    const icon = c >= 85 ? '\u2713' : c >= 70 ? '\u25D0' : '!';
    const word = ev.verification || (c >= 85 ? 'Verified' : c >= 70 ? 'Partly verified' : 'Needs source');
    const notes = ev.verificationNotes ? `<div class="vnotes">${esc(ev.verificationNotes)}</div>` : '';
    return `<div class="stamp ${cls}" title="Confidence score out of 100"><span aria-hidden="true">${icon}</span>${esc(word)} \u00b7 ${c}%</div>${notes}`;
  }
  /* ───────── impact scores: label, seven areas, note, cause-and-effect links ───────── */
  const AREAS = [['impactImage', 'Image'], ['impactWealth', 'Wealth'], ['impactEducation', 'Education'], ['impactPower', 'Power'],
    ['impactRights', 'Rights & Safety'], ['impactHealth', 'Health'], ['impactCulture', 'Culture']];
  function impactHtml(ev) {
    const scores = AREAS.map(([k, name]) => ({ name, v: parseFloat(ev[k]) || 0 })).filter(a => a.v !== 0);
    const links = ev.links || {};
    const led = links.ledTo || [], from = links.followedFrom || [];
    if (!scores.length && !ev.impactNotes && !led.length && !from.length) return '';
    const label = ev.impact || (scores.length ? '' : 'Neutral');
    const total = parseFloat(ev.impactTotal);
    const tot = Number.isFinite(total) && scores.length ? `<span class="muted" style="font-weight:400">${total > 0 ? '+' : total < 0 ? '\u2212' : ''}${Math.abs(total)} impact points</span>` : '';
    const chips = scores.map(a => `<span class="chip ${a.v > 0 ? 'up' : 'down'}">${esc(a.name)} ${a.v > 0 ? '+' : '\u2212'}${Math.abs(a.v)}</span>`).join('');
    const chain = (lbl, list) => list.length ? `<div class="chain"><span class="lbl">${lbl}: </span>` +
      list.map(l => `<button type="button" data-slug="${esc(l.slug)}">${esc(l.title)} (${esc(l.year)})</button>`).join(' \u00b7 ') + '</div>' : '';
    return `<div class="impact"><div class="hd">Impact ${label ? `<span class="imp ${label.toLowerCase()}">${esc(label)}</span>` : ''} ${tot}</div>
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      ${ev.impactNotes ? `<p class="note">${esc(ev.impactNotes)}</p>` : ''}
      ${chain('Followed from', from)}${chain('Led to', led)}</div>`;
  }
  function sourcesHtml(ev) {
    const list = String(ev.sources || '').split('\n').map(x => x.trim()).filter(x => /^https?:\/\//i.test(x));
    if (!list.length) return '';
    return '<div class="srcs"><span class="muted">Sources: </span>' + list.map(u =>
      `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(hostOf(u))}</a>`).join('') + '</div>';
  }
  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } }

  /* ───────── helpers ───────── */
  // Wix image fields look like wix:image://v1/<file>/<name>#... → turn into a normal web address.
  function imageUrl(u) {
    if (!u || typeof u !== 'string') return '';
    const m = u.match(/^wix:image:\/\/v1\/([^/]+)/);
    if (m) return 'https://static.wixstatic.com/media/' + m[1];
    return /^https?:\/\//i.test(u) ? u : '';
  }
  function inRange(y) { return Number.isFinite(y) && y >= info.startYear && y <= info.endYear; }
  function num(v) { const n = parseInt(v, 10); return Number.isFinite(n) ? n : undefined; }
  function setStatus(msg) { $('status').textContent = msg || ''; }
  function flash(msg) { setStatus(msg); setTimeout(() => { if ($('status').textContent === msg) setStatus(''); }, 4000); }
  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
  function pad4(n) { return String(n).padStart(4, '0'); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
})();
</script>
